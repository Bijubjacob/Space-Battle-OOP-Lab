<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Space Battle OOP Lab</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="title">
        <h1>Space Battle</h1>
        <div id="hud">
            <p id="player-hull">Player Hull: 20</p>
            <p id="score">Score: 0</p>
            <p id="health">Health: 100</p>
            <p id="enemy-hull">Enemy Hull: 6</p> <!-- Display enemy hull here -->
        </div>
    </div>

    <div class="container">
        <img class="stars" alt="" />
    </div>

    <div class="battlemage">
        <h1>USS Battlemage</h1>
        <div class="controls">
            <button id="start" aria-label="Start the game">Start</button>
            <button id="attack" aria-label="Attack the enemy">Attack</button>
            <button id="retreat" aria-label="Retreat from battle">Retreat</button><br>
            <h4>Use "SPACEBAR" to fire laser</h4>
            <h4>Use "RIGHT" and "LEFT" arrow keys to move</h4>
        </div>
    </div>

    <div id="game-over" style="display:none;">
        <h2>Game Over!</h2>
        <button id="restart-button">Restart</button>
    </div>

    <script src="app.js" defer></script>
</body>

</html>
